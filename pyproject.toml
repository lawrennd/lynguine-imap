[tool.poetry]
name = "lynguine-imap"
version = "0.1.0"
description = "IMAP mailbox subjects as a lynguine tabular IO type."
authors = ["Neil D. Lawrence <lawrennd@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "lynguine_imap"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
lynguine = ">=0.1.2"
pandas = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.poetry.plugins."lynguine.io_types"]
imap = "lynguine_imap"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
